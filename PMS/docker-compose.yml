# Başlat:  docker compose up -d --build   (PMS/ klasöründe)
# Ayarlar backend/pms/.env dosyasından okunur (yerel çalıştırma ile aynı dosya).
# Şablon: backend/pms/.env.example

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/pms/.env
    # Postgres imajı POSTGRES_* bekler; .env'deki DATABASE_* değerlerini eşleriz.
    entrypoint: ["sh", "-c", 'export POSTGRES_DB="$$DATABASE_NAME" POSTGRES_USER="$$DATABASE_USER" POSTGRES_PASSWORD="$$DATABASE_PASSWORD"; exec docker-entrypoint.sh postgres']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$DATABASE_USER" -d "$$DATABASE_NAME"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    <<: *hardening

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    logging: *logging
    <<: *hardening
    # redis imajı gosu/setpriv ile kullanıcı değiştirir: cap_drop uygulanmaz.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/pms/.env
    environment: &backend-env
      # Container içinde DB/Redis'e servis adıyla bağlanılır; DEBUG her zaman kapalı.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      # 4xx (host/yetki) yanıtı da gunicorn'un ayakta olduğunu gösterir; yalnızca 5xx/bağlantı hatası fail.
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request,urllib.error\ntry:\n    urllib.request.urlopen('http://127.0.0.1:8000/api/public/properties/', timeout=5)\nexcept urllib.error.HTTPError as e:\n    sys.exit(0 if e.code < 500 else 1)\nexcept Exception:\n    sys.exit(1)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging: *logging
    <<: *hardening
    cap_drop: [ALL]

  # Celery worker: Beds24 senkron, webhook işleme vb. arka plan işleri.
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/pms/.env
    environment: *backend-env
    command: ["celery", "-A", "pms", "worker", "-l", "info", "--concurrency", "2"]
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A pms inspect ping -d celery@$$HOSTNAME -t 8 >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging: *logging
    <<: *hardening
    cap_drop: [ALL]

  # Celery beat: periyodik görevler (10 dk'da bir rezervasyon polling, 03:00 tam senkron).
  beat:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./backend/pms/.env
    environment: *backend-env
    command: ["celery", "-A", "pms", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging
    <<: *hardening
    cap_drop: [ALL]

  frontend:
    build: ./frontend
    restart: unless-stopped
    container_name: pms-frontend   # roomy-caddy (infra/) pms.roomy.tr'yi buraya proxy'ler
    depends_on:
      - backend
    # Host'ta port yayınlanmaz; yalnızca roomy_edge ağından erişilir.
    networks:
      - default
      - edge
    volumes:
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    <<: *hardening

volumes:
  pgdata:
  media:
  static:
  redisdata:

networks:
  edge:
    name: roomy_edge
    external: true
